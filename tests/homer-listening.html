<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homer listening test</title>
<style>
:root{color-scheme:light dark;font:1rem/1.5 system-ui,sans-serif}body{max-width:36rem;margin:2.5rem auto;padding:0 1rem}h1{font-size:2rem;line-height:1.1}p{margin:.6rem 0}audio{display:block;width:100%;margin:.55rem 0 1rem}select,button{font:inherit;padding:.35rem .8rem}label{display:inline-block;margin:0 .75rem .6rem 0}fieldset{border:1px solid #8888;border-radius:.4rem;margin:.8rem 0}#switch{display:flex;gap:.5rem}button[aria-pressed=true]{box-shadow:inset 0 0 0 2px currentColor;font-weight:bold}#result{margin:.8rem 0;font-weight:bold}
</style>
<main><h1>Live Homer listening test</h1>
<p>Listen for the character’s voice, then listen for audible glitches. Each pair compares the old and revised live mic on the same performance at matched loudness.</p>
<details><summary>Hear the Homer reference</summary><audio id="reference" src="reference.wav" controls preload="none"></audio></details>
<p><label>Recording <select id="recording"></select></label></p>
<div id="switch"><button id="a" type="button">A</button><button id="b" type="button">B</button></div>
<audio id="player" controls preload="metadata"></audio>
<fieldset><legend>Which sounds more like Homer?</legend><label><input type="radio" name="voice" value="A"> A</label><label><input type="radio" name="voice" value="B"> B</label><label><input type="radio" name="voice" value="Tie"> Tie</label></fieldset>
<fieldset><legend>Which has fewer artifacts?</legend><label><input type="radio" name="sound" value="A"> A</label><label><input type="radio" name="sound" value="B"> B</label><label><input type="radio" name="sound" value="Tie"> Tie</label></fieldset>
<button id="reveal" type="button">Reveal versions</button><p id="result" aria-live="polite"></p>
</main><script>
const cases = /*CASES*/[];
const get = id => document.getElementById(id);
const recording = get('recording'), player = get('player');
for(const name of cases) recording.add(new Option(name[0].toUpperCase()+name.slice(1),name));
let order, selected, revision=0;
function select(index, start) {
  if(selected===index && start){player.play().catch(()=>{});return}
  const position = selected===null || player.ended ? 0 : player.currentTime;
  const ticket = ++revision;
  selected=index;
  get('reference').pause();
  for(const [i,id] of ['a','b'].entries()) get(id).setAttribute('aria-pressed',String(i===index));
  player.pause();
  player.onloadedmetadata=()=>{
    if(ticket!==revision)return;
    player.currentTime=Math.min(position,player.duration);
    if(start)player.play().catch(()=>{});
  };
  player.src=order[index]+'-'+recording.value+'.wav';
}
function reset(){
  order=crypto.getRandomValues(new Uint8Array(1))[0]%2 ? ['old','live'] : ['live','old'];
  selected=null;
  document.querySelectorAll('input').forEach(r=>r.checked=false);
  get('result').textContent=''; select(0,false);
}
get('a').onclick=()=>select(0,true);get('b').onclick=()=>select(1,true);
get('reference').onplay=()=>player.pause();player.onplay=()=>get('reference').pause();
recording.onchange=reset;
get('reveal').onclick=()=>{
  const names={old:'old live mic',live:'revised live mic'};
  const vote=n=>document.querySelector('input[name="'+n+'"]:checked')?.value;
  const answer=(v)=>v==='Tie'?'tie':v?names[order[v==='A'?0:1]]:'unrated';
  get('result').textContent='A = '+names[order[0]]+'. B = '+names[order[1]]+'. Likeness: '+answer(vote('voice'))+'. Fewer artifacts: '+answer(vote('sound'))+'.';
};
reset();
</script></html>
